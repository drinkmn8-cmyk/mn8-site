<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qualification</title>

    <!-- IMPORTANT: bump v= number anytime you change CSS to break cache -->
    <link rel="stylesheet" href="./style.css?v=6" />

    <!-- Fix native select dropdown (white-on-white) without changing your site style -->
<style>
  /* ===== MN8 Light Select System ===== */

  select.control {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;

    background-color: rgba(255,255,255,.78);
    color: rgba(11,13,18,.92);

    border: 1px solid rgba(15,18,24,.10);
    border-radius: 16px;

    padding: 14px 40px 14px 14px;
    font-size: 14px;
    font-weight: 500;

    box-shadow: 0 10px 24px rgba(15,18,24,.04);

    transition: border-color .15s ease,
                box-shadow .15s ease,
                transform .12s ease;

    cursor: pointer;
  }

  /* Focus ring = MN8 purple */
  select.control:focus {
    outline: none;
    border-color: rgba(109,59,210,.35);
    box-shadow:
      0 0 0 6px rgba(109,59,210,.10),
      0 10px 24px rgba(15,18,24,.04);
  }

  /* Dropdown arrow */
  select.control {
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1L6 6L11 1' stroke='%236D3BD2' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 12px;
  }

  /* Option styling (browser-controlled but improves consistency) */
  select.control option,
  select.control optgroup {
    background-color: #ffffff;
    color: rgba(11,13,18,.92);
  }

  /* Placeholder / disabled option */
  select.control option[disabled] {
    color: rgba(11,13,18,.45);
  }

</style>
  </head>

  <body id="top">
    <!-- TOPBAR (same vibe as site) -->
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./index.html#top" aria-label="MN8 Home">
          <img class="brand-logo" src="./logo.svg" alt="MN8" />
        </a>

<nav class="nav" aria-label="Primary">
  <a href="./index.html#mn8">What it is</a>
  <a href="./index.html#process">Process</a>
  <a href="./index.html#faq">FAQ</a>
</nav>


        <a class="btn btn-ghost btn-sm" href="./index.html#top">Back</a>
      </div>
    </header>

<main>
  <section class="section" id="qualification">
    <div class="wrap">
      <div class="card cardPad qualifyCard">
        <div class="qualifyHead">
          <h1 class="h2 qualifyTitle">Qualification</h1>
          <p class="sub qualifySub">Short form. Clear signal. Fast review.</p>
        </div>

        <form id="qualifyForm" class="qualifyForm" novalidate>
          <input type="hidden" id="clientTimestamp" name="clientTimestamp" value="" />

          <div class="qualifyGrid">
            <div class="field">
              <label for="fullName">Full name</label>
              <input
                class="control"
                id="fullName"
                name="fullName"
                type="text"
                placeholder="Your name"
                autocomplete="name"
                required
              />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input
                class="control"
                id="email"
                name="email"
                type="email"
                placeholder="you@email.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="field spanAll">
              <label for="describe">Which best describes you?</label>
              <select class="control" id="describe" name="describe" required>
                <option value="" selected disabled>Select one</option>
                <option value="High-responsibility professional">High-responsibility professional</option>
                <option value="Entrepreneur / operator">Entrepreneur / operator</option>
                <option value="Busy parent with a full schedule">Busy parent with a full schedule</option>
                <option value="High performer rebuilding consistency">High performer rebuilding consistency</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="breaks">What breaks consistency for you?</label>
              <select class="control" id="breaks" name="breaks" required>
                <option value="" selected disabled>Select one</option>
                <option value="Schedule overload / no time margin">Schedule overload / no time margin</option>
                <option value="Decision fatigue / mental load">Decision fatigue / mental load</option>
                <option value="Travel / unpredictability">Travel / unpredictability</option>
                <option value="Stress eating / low control at night">Stress eating / low control at night</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="restarts">How often have you restarted?</label>
              <select class="control" id="restarts" name="restarts" required>
                <option value="" selected disabled>Select one</option>
                <option value="Rarely">Rarely</option>
                <option value="A few times a year">A few times a year</option>
                <option value="Every 1–2 months">Every 1–2 months</option>
                <option value="Constant cycle">Constant cycle</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="result">What result would make this a win in 90 days?</label>
              <input
                class="control"
                id="result"
                name="result"
                type="text"
                placeholder="Example: -10 lbs while keeping my schedule"
                required
              />
            </div>

            <div class="field">
              <label for="ready">If accepted, ready to start immediately?</label>
              <select class="control" id="ready" name="ready" required>
                <option value="" selected disabled>Select one</option>
                <option value="Yes">Yes</option>
                <option value="Within 7 days">Within 7 days</option>
                <option value="Not yet">Not yet</option>
              </select>
            </div>

            <div class="field">
              <label for="structure">Can you follow a simple daily structure?</label>
              <select class="control" id="structure" name="structure" required>
                <option value="" selected disabled>Select one</option>
                <option value="Yes">Yes</option>
                <option value="Probably">Probably</option>
                <option value="No">No</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="why">Why MN8 specifically?</label>
              <textarea
                class="control"
                id="why"
                name="why"
                placeholder="One sentence is enough."
                required
              ></textarea>
            </div>
          </div>

          <div class="qualifyActions">
            <button class="btnPrimary" id="submitBtn" type="submit">Submit Qualification</button>
            <span class="qualifyNote" id="formNote">You’ll receive next steps by email if approved.</span>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<script>
  const ENDPOINT_URL = "https://qsrsfzebsncrvkqiabnu.supabase.co/functions/v1/qualify-submit";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcnNmemVic25jcnZrcWlhYm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MjAwMDYsImV4cCI6MjA4NTM5NjAwNn0._PjCnlHKDomrUscaaqJ2esB31tcdR0OnuR6bgC1-5HE";

  const form = document.getElementById("qualifyForm");
  const submitBtn = document.getElementById("submitBtn");
  const formNote = document.getElementById("formNote");
  const clientTs = document.getElementById("clientTimestamp");

  if (clientTs) clientTs.value = new Date().toISOString();

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.textContent = isLoading ? "Submitting..." : "Submit Qualification";
    formNote.textContent = isLoading ? "Submitting…" : "You’ll receive next steps immediately.";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) return form.reportValidity();

    const payload = Object.fromEntries(new FormData(form).entries());
    payload.userAgent = navigator.userAgent;
    payload.pageUrl = location.href;
    payload.clientTimestamp = new Date().toISOString();

    try {
      setLoading(true);

      const res = await fetch(ENDPOINT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
        },
        body: JSON.stringify(payload),
      });

      const text = await res.text();
      let out = {};
      try { out = JSON.parse(text); } catch { out = { raw: text }; }

      if (!res.ok) {
        console.error("HTTP", res.status, out);
        alert(`Submit failed (${res.status}). Check console.`);
        return;
      }

    console.log("QUALIFY RESPONSE OUT:", out);
console.log("QUALIFY RESPONSE TEXT:", text);

      if (!out.ok) {
        console.error("Edge error:", out);
        alert(`Submit failed: ${out.error || out.reason || "Unknown error"}`);
        return;
      }

      // REJECT: go to not accepted page (unchanged)
      if (out.decision === "reject") {
        window.location.href = `./not-accepted.html?reason=${encodeURIComponent(out.reason || "")}`;
        return;
      }

      // ACCEPT: token MUST come from the response
      const token =
        (out.token || "").trim() ||
        (out.access_token || "").trim() ||
        (out.t || "").trim();

      if (!token) {
        console.error("No token returned from edge function:", out);
        alert("Accepted, but no token was returned. Check your Edge Function response.");
        return;
      }

      // Store token for stability + redirect
      localStorage.setItem("mn8_token", token);
      window.location.href = `./private.html?status=accept&token=${encodeURIComponent(token)}`;

    } catch (err) {
      console.error(err);
      alert("Submission failed. Check console.");
    } finally {
      setLoading(false);
    }
  });
</script>
  </body>
</html>
