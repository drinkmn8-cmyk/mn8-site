<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MN8 — Accepted</title>

    <!-- IMPORTANT: bump v= number anytime you change CSS to break cache -->
    <link rel="stylesheet" href="./style.css?v=6" />

    <meta name="robots" content="noindex, nofollow" />
  </head>

  <body id="top">
    <!-- TOPBAR -->
    <header class="topbar">
      <div class="wrap topbar-inner">
        <a class="brand" href="./index.html#top" aria-label="MN8 Home">
          <img class="brand-logo" src="./logo.svg" alt="MN8" />
        </a>

        <a class="btn btn-ghost btn-sm" href="./index.html#top">Back</a>
      </div>
    </header>

    <main>
      <section class="section">
        <div class="wrap">
          <div class="form-card">
            <h1 class="form-title">Accepted</h1>

            <p class="lead" style="margin-top: 10px;">
              You’re in.
              <span class="muted">We’re opening your private access now.</span>
            </p>

            <div class="callout" style="margin-top: 18px;">
              <div class="callout-line"></div>
              <p class="callout-text" id="statusText">Redirecting…</p>
            </div>

            <div class="form-actions" style="margin-top: 18px;">
              <button class="btn btn-primary" id="continueBtn" type="button">
                Continue
              </button>
              <span class="form-note" id="noteText">
                If you aren’t redirected in a few seconds, tap Continue.
              </span>
            </div>

            <p class="muted" style="margin-top: 14px; font-size: 12px;">
              Don’t share this link. Access is tied to your submission.
            </p>
          </div>
        </div>
      </section>
    </main>

<script>
  (function () {
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");

    const statusText = document.getElementById("statusText");
    const continueBtn = document.getElementById("continueBtn");

    let redirected = false;

    function goPrivate() {
      if (redirected) return;

      if (!token || token.length < 10) {
        statusText.textContent =
          "Access token missing or invalid. Please submit the qualification again.";

        continueBtn.textContent = "Return to Qualification";
        continueBtn.onclick = () => {
          window.location.href = "./qualify.html";
        };

        return;
      }

      redirected = true;
      window.location.replace(
        `./private.html?token=${encodeURIComponent(token)}`
      );
    }

    // Auto-forward (fast)
    setTimeout(goPrivate, 400);

    // Manual fallback
    continueBtn.addEventListener("click", goPrivate);
  })();
</script>
  </body>
</html>
