<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accepted — MN8</title>
  <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body id="top">
  <main class="section">
    <div class="wrap">
      <div class="form-card">
        <h1 class="form-title">Accepted</h1>
        <p class="p">You’re in. Redirecting to private access…</p>
      </div>
    </div>
  </main>

<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";

  // If token missing, don’t pretend
  if (!token) {
    window.location.href = "./not-accepted.html?reason=" + encodeURIComponent("Missing access token");
  } else {
    // Send them to private page with token
    window.location.href = `./private.html?token=${encodeURIComponent(token)}`;
  }
</script>
</body>
</html>
