<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Payment Confirmed • MN8</title>
  <meta name="robots" content="noindex,nofollow" />

  <style>
    :root{
      --ink:#0b0d12;
      --muted:rgba(11,13,18,.62);
      --line:rgba(11,13,18,.10);
      --bg:#ffffff;
      --mn8:#632f96;
      --mn8b:#8c5fd2;
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--ink);
    }

    .wrap{
      width:min(920px, 100%);
      margin:0 auto;
      padding:28px 20px;
    }

    .card{
      margin-top:48px;
      border:1px solid var(--line);
      border-radius:18px;
      padding:26px;
      background:#fff;
    }

    h1{
      margin:0 0 8px 0;
      font-size:28px;
      letter-spacing:-.02em;
      line-height:1.12;
      font-weight:900;
    }

    .sub{
      margin:0 0 18px 0;
      font-size:15px;
      line-height:1.5;
      color:var(--muted);
      max-width:62ch;
    }

    .btnRow{
      display:flex;
      gap:12px;
      align-items:center;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .btn{
      appearance:none;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      padding:12px 14px;
      border-radius:999px;
      font-weight:850;
      cursor:pointer;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:44px;
      transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      user-select:none;
      white-space:nowrap;
    }

    .btnPrimary{
      border:0;
      background:linear-gradient(135deg, var(--mn8), var(--mn8b));
      color:#fff;
      box-shadow:0 10px 24px rgba(99,47,150,.18);
    }

    .btn:hover{ transform:translateY(-1px); }
    .btn:active{ transform:translateY(0px); }

    .tip{
      margin-top:14px;
      font-size:12.5px;
      color:rgba(11,13,18,.55);
    }

    /* Mobile: stack buttons */
    @media (max-width: 520px){
      .card{ margin-top:28px; padding:20px; }
      h1{ font-size:24px; }
      .btnRow{ flex-direction:column; align-items:stretch; }
      .btn{ width:100%; }
    }
  </style>
</head>
<script src="/route.js?v=1"></script>
<body>
  <div class="bgStage" id="bgStage" aria-hidden="true">
    <div class="particles"></div>
  </div>

<header class="topbar">
  <div class="wrap topbarInner">

    <a href="/" class="brand">
      <img src="/mn8-logo.svg" alt="MN8" class="brandLogo">
    </a>


  </div>
</header>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Payment confirmed.</h1>
      <p class="sub">Download the MN8 app using the buttons below.</p>

      <div class="btnRow">
        <!-- Replace these 3 links with your real URLs -->
        <a class="btn btnPrimary" href="https://apple.com" target="_blank" rel="noopener">Download on App Store</a>
        <a class="btn" href="https://play.google.com" target="_blank" rel="noopener">Get it on Google Play</a>
        <a class="btn" href="mn8://open">Open the app</a>
      </div>

      <div class="tip">
        Tip: Save this page. If you switch devices, use the same store account you purchased it with.
      </div>
    </section>
  </main>
</body>
</html>
