<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qualification</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --mn8:#6D3BD2;
  --ink:#0B0D12;
  --muted:rgba(11,13,18,.65);
  --bg:#ffffff;
  --radius:22px;
  --shadow:0 10px 30px rgba(15,18,24,.06);
  --gutter:64px;
  --gutterMobile:32px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Lato", system-ui, -apple-system, Segoe UI, Roboto, Arial;
  background:#ffffff;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}

.wrap{
  width:min(1360px, calc(100% - var(--gutter)));
  margin:0 auto;
}
@media (max-width:900px){
  .wrap{ width:calc(100% - var(--gutterMobile)); }
}

/* ===== TOPBAR ===== */
.topbar{
  position:sticky;
  top:0;
  background:#ffffff;
  z-index:50;
  border-bottom:0px solid rgba(15,18,24,.06);
}
.topbarInner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 0;
}
.brandLogo{
  height: 60px;     /* realistic header size */
  width: auto;
  display:block;
  transform: scale(1.25);
  transform-origin: left center;
}

/* ===== SECTION ===== */
.section{
  padding:90px 0;
}

/* ===== CARD ===== */
.card{
  background:#ffffff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:48px;
}
@media (max-width:740px){
  .card{ padding:32px 22px; }
}

.h2{
  margin:0 0 10px;
  font-size:42px;
  font-weight:900;
  letter-spacing:-.02em;
}
.sub{
  margin:0 0 40px;
  color:var(--muted);
  font-size:18px;
}

/* ===== FORM ===== */
.qualifyGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}
@media (max-width:900px){
  .qualifyGrid{ grid-template-columns:1fr; }
}

.field{
  display:flex;
  flex-direction:column;
  gap:8px;
}
.spanAll{ grid-column:1/-1; }

label{
  font-size:13px;
  font-weight:700;
  color:rgba(11,13,18,.55);
}

.control{
  border:1px solid rgba(15,18,24,.12);
  border-radius:16px;
  padding:14px 16px;
  font-size:14px;
  font-family:"Lato";
  background:#ffffff;
  transition:border .15s ease, box-shadow .15s ease;
}
.control:focus{
  outline:none;
  border-color:rgba(109,59,210,.45);
  box-shadow:0 0 0 4px rgba(109,59,210,.10);
}

/* ===== BUTTON ===== */
.qualifyActions{
  margin-top:40px;
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}

.btnPrimary{
  appearance:none;
  border:0;
  background:var(--mn8);
  color:#fff;
  padding:14px 22px;
  border-radius:999px;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(109,59,210,.25);
  transition:transform .1s ease, filter .1s ease;
}
.btnPrimary:hover{ filter:brightness(1.05); }
.btnPrimary:active{ transform:translateY(1px); }

.qualifyNote{
  font-size:14px;
  color:rgba(11,13,18,.55);
}

  /* =========================
   MN8 Minimal Legal Footer
   ========================= */

.mn8Footer{
  margin-top: 80px;
  padding: 40px 0 60px;
  text-align: center;
}

.mn8FooterLinks{
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 18px;
  margin-bottom: 14px;
}

.mn8FooterLinks a{
  font-size: 13px;
  font-weight: 700;
  color: rgba(11,13,18,.55);
  text-decoration: none;
  transition: color .15s ease;
}

.mn8FooterLinks a:hover{
  color: rgba(11,13,18,.85);
}

.mn8FooterCopy{
  font-size: 12px;
  color: rgba(11,13,18,.45);
}
</style>
</head>

<script src="/route.js?v=1"></script>
<body>

<header class="topbar">
  <div class="wrap topbarInner">
    <a href="/"">
      <img src="/mn8-logo.svg" alt="MN8" class="brandLogo">
    </a>
  </div>
</header>

<main>
  <section class="section">
    <div class="wrap">
      <div class="card">

        <h1 class="h2">Qualification</h1>
        <p class="sub"></p>

        <form id="qualifyForm" novalidate>
          <input type="hidden" id="clientTimestamp" name="clientTimestamp" />

          <div class="qualifyGrid">

            <div class="field">
              <label for="fullName">Full name</label>
              <input class="control" id="fullName" name="fullName" required>
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input class="control" id="email" name="email" type="email" required>
            </div>

            <div class="field spanAll">
              <label for="describe">Which best describes you?</label>
              <select class="control" id="describe" name="describe" required>
                <option value="" disabled selected>Select one</option>
                <option>High-responsibility professional</option>
                <option>Entrepreneur / operator</option>
                <option>Busy parent</option>
                <option>High performer rebuilding consistency</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="breaks">What breaks consistency for you?</label>
              <select class="control" id="breaks" name="breaks" required>
                <option value="" disabled selected>Select one</option>
                <option>Schedule overload</option>
                <option>Decision fatigue</option>
                <option>Travel</option>
                <option>Stress eating</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="restarts">How often have you restarted?</label>
              <select class="control" id="restarts" name="restarts" required>
                <option value="" disabled selected>Select one</option>
                <option>Rarely</option>
                <option>A few times a year</option>
                <option>Every 1–2 months</option>
                <option>Constant cycle</option>
              </select>
            </div>

            <div class="field spanAll">
              <label for="result">What result would make this a win in 90 days?</label>
              <input class="control" id="result" name="result" required>
            </div>

            <div class="field spanAll">
              <label for="why">Why MN8 specifically?</label>
              <textarea class="control" id="why" name="why" required></textarea>
            </div>

          </div>

          <div class="qualifyActions">
            <button class="btnPrimary" id="submitBtn" type="submit">
              Submit Qualification
            </button>
            <span class="qualifyNote" id="formNote">
              You’ll receive next steps immediately.
            </span>
          </div>

        </form>
      </div>
    </div>
  </section>
</main>

<footer class="mn8Footer">
  <div class="wrap">
    <div class="mn8FooterLinks">
      <a href="/terms" data-route="terms">Terms</a>
      <a href="/privacy" data-route="privacy">Privacy</a>
      <a href="/services" data-route="services">Services</a>
      <a href="/support" data-route="support">Support</a>
    </div>
    <div class="mn8FooterCopy">
      © 2026 MN8. All rights reserved.
    </div>
  </div>
</footer>


<!-- ===== YOUR SCRIPT (UNCHANGED) ===== -->
<script>
  const ENDPOINT_URL = "https://qsrsfzebsncrvkqiabnu.supabase.co/functions/v1/qualify-submit";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcnNmemVic25jcnZrcWlhYm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MjAwMDYsImV4cCI6MjA4NTM5NjAwNn0._PjCnlHKDomrUscaaqJ2esB31tcdR0OnuR6bgC1-5HE";

  const form = document.getElementById("qualifyForm");
  const submitBtn = document.getElementById("submitBtn");
  const formNote = document.getElementById("formNote");
  const clientTs = document.getElementById("clientTimestamp");

  if (clientTs) clientTs.value = new Date().toISOString();

  function setLoading(isLoading) {
    submitBtn.disabled = isLoading;
    submitBtn.textContent = isLoading ? "Submitting..." : "Submit Qualification";
    formNote.textContent = isLoading ? "Submitting…" : "You’ll receive next steps immediately.";
  }

  // =========================
  // ROUTING HELPERS (route.js driven)
  // =========================
  function goNotAccepted(reason = "") {
    try {
      if (window.MN8_ROUTE && typeof window.MN8_ROUTE.notAccepted === "function") {
        window.MN8_ROUTE.notAccepted({ reason });
        return;
      }
      if (typeof window.routeToNotAccepted === "function") {
        window.routeToNotAccepted({ reason });
        return;
      }
    } catch (e) {}

    // fallback (folder-style + then html)
    const qs = reason ? `?reason=${encodeURIComponent(reason)}` : "";
    window.location.href = `/not-accepted/${qs}`;
  }

  function goAccessAccepted(token) {
    try {
      if (window.MN8_ROUTE && typeof window.MN8_ROUTE.access === "function") {
        window.MN8_ROUTE.access({ status: "accept", token });
        return;
      }
      if (typeof window.routeToAccess === "function") {
        window.routeToAccess({ status: "accept", token });
        return;
      }
    } catch (e) {}

    // fallback (folder-style)
    window.location.href = `/access/?status=accept&token=${encodeURIComponent(token)}`;
  }


  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) return form.reportValidity();

    const payload = Object.fromEntries(new FormData(form).entries());
    payload.userAgent = navigator.userAgent;
    payload.pageUrl = location.href;
    payload.clientTimestamp = new Date().toISOString();

    try {
      setLoading(true);

      const res = await fetch(ENDPOINT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
        },
        body: JSON.stringify(payload),
      });

      const out = await res.json();

      if (!res.ok || !out.ok) {
        alert("Submission failed.");
        return;
      }

      if (out.decision === "reject") {
        goNotAccepted();
        return;
      }

      const token = out.token?.trim();
      if (!token) {
        alert("Accepted, but no token returned.");
        return;
      }

      localStorage.setItem("mn8_token", token);
      goAccessAccepted(token);

    } catch (err) {
      alert("Submission failed.");
    } finally {
      setLoading(false);
    }
  });
</script>

</body>
</html>
