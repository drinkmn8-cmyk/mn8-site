<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private — MN8</title>

  <!-- IMPORTANT: bump v= number anytime you change CSS to break cache -->
  <link rel="stylesheet" href="./style.css?v=6" />

  <style>
    /* default locked */
    #content { display: none; }
    #deny { display: none; }

    /* states */
    #content.is-on { display: block; }
    #deny.is-on { display: block; }
  </style>
</head>

<body id="top">
  <main class="section">
    <div class="wrap">

      <!-- DENIED -->
      <div class="form-card" id="deny">
        <h1 class="form-title">Access denied</h1>
        <p class="p" id="denyMsg">This link is invalid, expired, or already used.</p>

        <div style="margin-top:16px">
          <a class="btn btn-ghost btn-sm" href="./index.html#top">Back</a>
        </div>
      </div>

      <!-- PRIVATE CONTENT -->
      <div id="content">
        <div class="section-head">
          <h2 class="h2">Private Access</h2>
          <p class="lead">Welcome to MN8.</p>
        </div>

        <div class="card">
          <h3 class="h3">Start here</h3>
          <p class="p">Embed your private video here and your next steps.</p>
        </div>
      </div>

    </div>
  </main>
<script>
  const VERIFY_URL =
    "https://qsrsfzebsncrvkqiabnu.supabase.co/functions/v1/verify-token";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcnNmemVic25jcnZrcWlhYm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MjAwMDYsImV4cCI6MjA4NTM5NjAwNn0._PjCnlHKDomrUscaaqJ2esB31tcdR0OnuR6bgC1-5HE";

  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";

  const denyEl = document.getElementById("deny");
  const denyMsg = document.getElementById("denyMsg");
  const contentEl = document.getElementById("content");

  function deny(reason) {
    const map = {
      missing_token: "Missing access token. Please use your original link.",
      invalid: "This link is invalid.",
      expired: "This link expired. Please re-apply.",
      used: "This link was already used.",
      revoked: "This link is no longer active.",
      verification_error: "Verification failed. Please try again."
    };

    denyMsg.textContent = map[reason] || "This link is invalid, expired, or already used.";
    denyEl.classList.add("is-on");
    contentEl.classList.remove("is-on");
  }

  function allow() {
    contentEl.classList.add("is-on");
    denyEl.classList.remove("is-on");
  }

  async function verifyToken() {
    if (!token) return deny("missing_token");

    try {
      const res = await fetch(VERIFY_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
        },
        body: JSON.stringify({ token }),
      });

      const out = await res.json();

      if (!res.ok || !out.ok) return deny(out?.status || "invalid");
      if (out.status !== "active") return deny(out.status || "invalid");

      allow();
    } catch (e) {
      deny("verification_error");
    }
  }

  verifyToken();
</script>
</body>
</html>
