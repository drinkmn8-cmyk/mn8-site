<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private — MN8</title>

  <!-- IMPORTANT: bump v= number anytime you change CSS to break cache -->
  <link rel="stylesheet" href="./style.css?v=6" />

  <style>
    /* default locked */
    #content { display: none; }
    #deny { display: none; }

    /* states */
    #content.is-on { display: block; }
    #deny.is-on { display: block; }
  </style>
</head>

<body id="top">
  <main class="section">
    <div class="wrap">

      <!-- DENIED -->
      <div class="form-card" id="deny">
        <h1 class="form-title">Access denied</h1>
        <p class="p" id="denyMsg">This link is invalid, expired, or already used.</p>

        <div style="margin-top:16px">
          <a class="btn btn-ghost btn-sm" href="./index.html#top">Back</a>
        </div>
      </div>

      <!-- PRIVATE CONTENT -->
      <div id="content">
        <div class="section-head">
          <h2 class="h2">Private Access</h2>
          <p class="lead">Welcome to MN8.</p>
        </div>

        <div class="card">
          <h3 class="h3">Start here</h3>
          <p class="p">Embed your private video here and your next steps.</p>
        </div>
      </div>

    </div>
  </main>
<script>
  const VALIDATE_URL = "https://qsrsfzebsncrvkqiabnu.supabase.co/functions/v1/validate-token";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFzcnNmemVic25jcnZrcWlhYm51Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk4MjAwMDYsImV4cCI6MjA4NTM5NjAwNn0._PjCnlHKDomrUscaaqJ2esB31tcdR0OnuR6bgC1-5HE";

  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";

  async function deny(reason) {
    window.location.href = `./access-denied.html?reason=${encodeURIComponent(reason || "")}`;
  }

  (async () => {
    if (!token) return deny("missing_token");

    try {
      const res = await fetch(VALIDATE_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          apikey: ANON_KEY,
          Authorization: `Bearer ${ANON_KEY}`,
        },
        body: JSON.stringify({ token }),
      });

      const out = await res.json().catch(() => ({}));
      if (!res.ok || !out.ok) return deny(out.reason || out.error || "invalid_token");

      // ✅ Token is valid → allow page to load normally
      // If you hide content behind a gate, unlock it here:
      document.documentElement.classList.add("token-ok");
    } catch (e) {
      return deny("validate_failed");
    }
  })();
</script>
</body>
</html>
