<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private — MN8</title>
  <link rel="stylesheet" href="./style.css?v=2" />
  <style>
    /* hide content until verified */
    .locked { display:none; }
    .deny { display:none; }
    .deny.is-on { display:block; }
    .locked.is-on { display:block; }
  </style>
</head>
<body id="top">
  <main class="section">
    <div class="wrap">

      <div class="form-card deny" id="deny">
        <h1 class="form-title">Access denied</h1>
        <p class="p">This link is invalid, expired, or already used.</p>
        <div style="margin-top:16px">
          <a class="btn btn-ghost btn-sm" href="./index.html#top">Back</a>
        </div>
      </div>

      <div class="locked" id="content">
        <div class="section-head">
          <h2 class="h2">Private Access</h2>
          <p class="lead">Welcome to MN8.</p>
        </div>

        <!-- Replace this with your video + private content -->
        <div class="card">
          <h3 class="h3">Start here</h3>
          <p class="p">Embed your private video here and your next steps.</p>
        </div>
      </div>

    </div>
  </main>

<script>
  const VERIFY_ENDPOINT = "YOUR_NEW_APPS_SCRIPT_EXEC_URL"; // same exec URL
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token") || "";

  async function verify() {
    if (!token) {
      window.location.href = "./not-accepted.html?reason=" + encodeURIComponent("Missing access token");
      return;
    }

    const res = await fetch(`${VERIFY_ENDPOINT}?token=${encodeURIComponent(token)}`);
    const out = await res.json();

    if (!out.ok || out.status !== "active") {
      // expired / invalid / used / revoked
      window.location.href =
        "./not-accepted.html?reason=" + encodeURIComponent(out.status || "invalid");
      return;
    }

    // ✅ Valid token: reveal the private content
    document.documentElement.classList.add("access-ok");
    document.getElementById("lockedBlock").hidden = true;
    document.getElementById("privateBlock").hidden = false;
  }

  verify().catch(() => {
    window.location.href = "./not-accepted.html?reason=" + encodeURIComponent("verification_error");
  });
</script>
</body>
</html>
